id: yc_oss_to_fulltext
namespace: ventures
labels:
  name: YC OSS full-text search table

description: |
  Downstream of yc_oss_to_ventures_db. Reads every row already loaded into
  ventures_db.yc_oss (no re-fetch from the API), combines the descriptive
  fields into title/content text per company, and upserts into
  yc_oss_fulltext -- a table with a generated, stored tsvector column
  (search_vector) for Postgres full-text search. This is the keyword-search
  side of the hybrid search pipeline (paired later with pgvector similarity
  search).

triggers:
  - id: after_ventures_db
    type: io.kestra.plugin.core.trigger.Flow
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionStatusCondition
        in:
          - SUCCESS
      - type: io.kestra.plugin.core.condition.ExecutionFlowCondition
        namespace: ventures
        flowId: yc_oss_to_ventures_db

tasks:
  - id: load_fulltext
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      networkMode: ventures_net
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --quiet psycopg2-binary
    script: |
      import psycopg2
      import psycopg2.extras

      CREATE_TABLE_SQL = """
      CREATE TABLE IF NOT EXISTS yc_oss_fulltext (
          id SERIAL PRIMARY KEY,
          company_id BIGINT NOT NULL UNIQUE REFERENCES yc_oss(id) ON DELETE CASCADE,
          title TEXT NOT NULL,
          content TEXT NOT NULL,
          search_vector tsvector GENERATED ALWAYS AS (
              setweight(to_tsvector('english', COALESCE(title, '')), 'A') ||
              setweight(to_tsvector('english', COALESCE(content, '')), 'B')
          ) STORED
      )
      """

      CREATE_INDEX_SQL = """
      CREATE INDEX IF NOT EXISTS yc_oss_fulltext_search_idx
          ON yc_oss_fulltext USING GIN (search_vector)
      """

      SELECT_SQL = """
      SELECT id, name, former_names, locations, long_description, one_liner,
             tags, industries, subindustry, is_hiring, top_company, non_profit,
             team_size, regions, stage, launched_at, batch, status
      FROM yc_oss
      """

      UPSERT_SQL = """
      INSERT INTO yc_oss_fulltext (company_id, title, content)
      VALUES %s
      ON CONFLICT (company_id) DO UPDATE SET
          title = EXCLUDED.title,
          content = EXCLUDED.content
      """


      def build_title(row: dict) -> str:
          name = row.get("name") or ""
          if row.get("one_liner"):
              return f"{name} — {row['one_liner']}"
          return name


      def build_content(row: dict) -> str:
          lines = []

          if row.get("former_names"):
              lines.append("Formerly known as: " + ", ".join(row["former_names"]))

          if row.get("long_description"):
              lines.append(row["long_description"])

          tags_line = []
          if row.get("industries"):
              tags_line.append("Industries: " + ", ".join(row["industries"]))
          if row.get("subindustry"):
              tags_line.append(f"Subindustry: {row['subindustry']}")
          if row.get("tags"):
              tags_line.append("Tags: " + ", ".join(row["tags"]))
          if tags_line:
              lines.append(" | ".join(tags_line))

          where = []
          if row.get("locations"):
              where.append(f"Location: {row['locations']}")
          if row.get("regions"):
              where.append("Regions: " + ", ".join(row["regions"]))
          if where:
              lines.append(" | ".join(where))

          status_bits = []
          if row.get("stage"):
              status_bits.append(f"Stage: {row['stage']}")
          if row.get("batch"):
              status_bits.append(f"YC batch: {row['batch']}")
          if row.get("status"):
              status_bits.append(f"Status: {row['status']}")
          if row.get("launched_at"):
              status_bits.append(f"Launched: {row['launched_at']:%Y-%m-%d}")
          if row.get("team_size"):
              status_bits.append(f"Team size: {row['team_size']}")
          if status_bits:
              lines.append(" | ".join(status_bits))

          flags = []
          if row.get("is_hiring"):
              flags.append("actively hiring")
          if row.get("top_company"):
              flags.append("marked a top company")
          if row.get("non_profit"):
              flags.append("a non-profit")
          if flags:
              lines.append("This company is " + ", ".join(flags) + ".")

          return "\n".join(lines)


      conn = psycopg2.connect(
          host="relational_db", port=5432,
          dbname="ventures_db", user="postgres", password="postgres",
      )
      try:
          with conn.cursor() as cur:
              cur.execute(CREATE_TABLE_SQL)
              cur.execute(CREATE_INDEX_SQL)
          conn.commit()

          with conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
              cur.execute(SELECT_SQL)
              companies = cur.fetchall()
          print(f"Loaded {len(companies)} companies from yc_oss")

          rows = [
              (company["id"], build_title(company), build_content(company))
              for company in companies
          ]

          with conn.cursor() as cur:
              psycopg2.extras.execute_values(cur, UPSERT_SQL, rows, page_size=500)
          conn.commit()
      finally:
          conn.close()

      print(f"Upserted {len(rows)} rows into ventures_db.yc_oss_fulltext")
