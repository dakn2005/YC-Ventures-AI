id: yc_oss_to_embeddings
namespace: ventures
labels:
  name: YC OSS embeddings

description: |
  Downstream of yc_oss_to_ventures_db (independent of yc_oss_to_fulltext -- both
  are siblings that rebuild their own title/content from yc_oss). Reads every
  row from yc_oss, rebuilds title/content per company via yc_oss_utils'
  build_title/build_content (the same namespace-file helpers yc_oss_to_fulltext
  uses), processes companies in batches (BATCH_SIZE=50): each batch is chunked
  as a group of documents into fixed-size, non-overlapping windows (size=500,
  step=500) -- chunks never span two companies, BATCH_SIZE only groups
  documents together for one model.encode() call -- embeds each chunk with
  SentenceTransformer('all-MiniLM-L6-v2') (384-dim, matches the embedding
  vector(384) column), and loads the result into yc_oss_embeddings for pgvector
  cosine similarity search (HNSW index).

triggers:
  - id: after_saving_ventures_db
    type: io.kestra.plugin.core.trigger.Flow
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionStatusCondition
        in:
          - SUCCESS
      - type: io.kestra.plugin.core.condition.ExecutionFlowCondition
        namespace: ventures
        flowId: yc_oss_to_ventures_db

tasks:
  - id: load_embeddings
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      networkMode: ventures_net
    containerImage: python:3.11-slim
    namespaceFiles:
      enabled: true
    beforeCommands:
      - pip install --quiet psycopg2-binary sentence-transformers
    script: |
      import psycopg2
      import psycopg2.extras
      from sentence_transformers import SentenceTransformer
      from yc_oss_utils import build_title, build_content

      CREATE_TABLE_SQL = """
      CREATE TABLE IF NOT EXISTS public.yc_oss_embeddings (
          id SERIAL PRIMARY KEY,
          company_id BIGINT NOT NULL,
          title TEXT NOT NULL,
          content TEXT NOT NULL,
          embedding vector(384)
      )
      """

      ADD_FK_SQL = """
      DO $$
      BEGIN
          IF NOT EXISTS (
              SELECT 1 FROM pg_constraint WHERE conname = 'yc_oss_embeddings_company_id_fkey'
          ) THEN
              ALTER TABLE public.yc_oss_embeddings
                  ADD CONSTRAINT yc_oss_embeddings_company_id_fkey
                  FOREIGN KEY (company_id) REFERENCES public.yc_oss(id) ON DELETE CASCADE;
          END IF;
      END $$;
      """

      CREATE_INDEX_SQL = """
      CREATE INDEX IF NOT EXISTS yc_oss_embeddings_embedding_hnsw_idx
          ON public.yc_oss_embeddings USING hnsw (embedding vector_cosine_ops)
      """

      SELECT_SQL = """
      SELECT id, name, former_names, locations, long_description, one_liner,
             tags, industries, subindustry, is_hiring, top_company, non_profit,
             team_size, regions, stage, launched_at, batch, status
      FROM yc_oss
      """

      INSERT_SQL = "INSERT INTO yc_oss_embeddings (company_id, title, content, embedding) VALUES %s"
      INSERT_TEMPLATE = "(%s, %s, %s, %s::vector)"

      CHUNK_SIZE = 500
      CHUNK_STEP = 500
      BATCH_SIZE = 50


      def chunk_documents(documents: list, size: int = CHUNK_SIZE, step: int = CHUNK_STEP) -> list:
          # Chunks are windowed per-document, never spanning two companies --
          # BATCH_SIZE only groups documents together for one model.encode() call.
          chunks = []
          for doc in documents:
              content = doc["content"]
              for start in range(0, len(content), step):
                  chunk_content = content[start:start + size]
                  if not chunk_content:
                      continue
                  chunks.append({
                      "company_id": doc["company_id"],
                      "title": doc["title"],
                      "content": chunk_content,
                  })
          return chunks


      def vec_to_str(vector) -> str:
          return "[" + ",".join(str(x) for x in vector) + "]"


      conn = psycopg2.connect(
          host="relational_db", port=5432,
          dbname="ventures_db", user="postgres", password="postgres",
      )
      try:
          with conn.cursor() as cur:
              cur.execute("CREATE EXTENSION IF NOT EXISTS vector")
              cur.execute(CREATE_TABLE_SQL)
              cur.execute(ADD_FK_SQL)
          conn.commit()

          with conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
              cur.execute(SELECT_SQL)
              companies = cur.fetchall()
          print(f"Loaded {len(companies)} companies from yc_oss")

          print("Loading SentenceTransformer model (all-MiniLM-L6-v2) ...")
          model = SentenceTransformer("all-MiniLM-L6-v2")

          rows = []
          for i in range(0, len(companies), BATCH_SIZE):
              batch_companies = companies[i:i + BATCH_SIZE]
              documents = [
                  {
                      "company_id": company["id"],
                      "title": build_title(company),
                      "content": build_content(company),
                  }
                  for company in batch_companies
              ]

              # batch_chunks = chunk_documents(documents)
              # texts = [chunk["content"] for chunk in batch_chunks]
              texts = [d["content"] for d in documents]
              vectors = model.encode(texts)

              # rows.extend(
              #     (chunk["company_id"], chunk["title"], chunk["content"], vec_to_str(vector))
              #     for chunk, vector in zip(batch_chunks, vectors)
              # )
              rows.extend(
                  (d["company_id"], d["title"], d["content"], vec_to_str(vector))
                  for d, vector in zip(documents, vectors)
              )

          print(f"Produced {len(rows)} chunks across {len(companies)} companies (batch_size={BATCH_SIZE}, chunk_size={CHUNK_SIZE}, chunk_step={CHUNK_STEP})")

          with conn.cursor() as cur:
              cur.execute("DELETE FROM yc_oss_embeddings")
              psycopg2.extras.execute_values(cur, INSERT_SQL, rows, template=INSERT_TEMPLATE, page_size=500)
          conn.commit()

          with conn.cursor() as cur:
              cur.execute(CREATE_INDEX_SQL)
          conn.commit()
      finally:
          conn.close()

      print(f"Loaded {len(rows)} embedding rows into ventures_db.yc_oss_embeddings")
