services:
  relational_db:
      image: pgvector/pgvector:pg16
      restart: always
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=postgres
      volumes:
        - db_volume:/var/lib/postgresql/data
      ports:
        - "5440:5432"

volumes:
  db_volume:

