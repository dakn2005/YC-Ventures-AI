include:
  - kestra/docker-compose.yml

volumes:
  db_volume:
    driver: local

networks:
  ventures_net:
    name: ventures_net
    driver: bridge

services:
  relational_db:
      image: pgvector/pgvector:pg16
      restart: always
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=postgres
      volumes:
        - db_volume:/var/lib/postgresql/data
      ports:
        - "5440:5432"
      networks:
        - ventures_net

